<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>boot test</title>
    <link rel="stylesheet" href="../src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <pre id="errors"></pre>

    <script>
      window.__errors = [];
      window.addEventListener("error", (e) =>
        window.__errors.push([e.message, e.filename, e.lineno, e.colno].join(" | "))
      );
      window.addEventListener("unhandledrejection", (e) =>
        window.__errors.push("rejection: " + (e.reason && (e.reason.stack || e.reason.message || e.reason)))
      );

      const registered = { palette: [], slash: [], blockMenu: [], pageMenu: [], schema: null };

      function memStorage() {
        window.__files = window.__files || {};
        return {
          getItem: async (k) => (k in window.__files ? window.__files[k] : null),
          setItem: async (k, v) => {
            window.__files[k] = v;
            return true;
          },
          removeItem: async (k) => {
            delete window.__files[k];
          },
          allKeys: async () => Object.keys(window.__files),
        };
      }

      window.logseq = {
        settings: { provider: "deepseek", model: "deepseek-chat", language: "zh" },
        useSettingsSchema: (s) => (registered.schema = s),
        updateSettings: (patch) => Object.assign(window.logseq.settings, patch),
        onSettingsChanged: () => {},
        provideStyle: () => {},
        provideModel: () => {},
        provideUI: () => {},
        showMainUI: () => {},
        hideMainUI: () => {},
        setMainUIInlineStyle: () => {},
        showSettingsUI: () => {},
        beforeunload: () => {},
        Editor: {
          getCurrentPage: async () => ({ name: "测试页面" }),
          getCurrentBlock: async () => ({ uuid: "b1", content: "测试块内容" }),
          getSelectedBlocks: async () => [],
          getAllPages: async () => [{ name: "测试页面" }],
          getPageBlocksTree: async () => [{ content: "页面根块", children: [{ content: "子块" }] }],
          getPage: async () => null,
          getBlock: async () => ({ uuid: "b1", content: "测试块内容" }),
          insertBlock: async () => ({ uuid: "new-block" }),
          appendBlockInPage: async () => ({ uuid: "new-block" }),
          updateBlock: async () => {},
          createPage: async (name) => ({ name: name }),
          deletePage: async () => {},
          removeBlock: async () => {},
          moveBlock: async () => {},
          registerSlashCommand: (tag, fn) => registered.slash.push(tag),
          registerBlockContextMenuItem: (label) => registered.blockMenu.push(label),
          registerHighlightContextMenuItem: (label) => registered.blockMenu.push(label),
        },
        App: {
          getUserConfigs: async () => ({ preferredThemeMode: "dark" }),
          onThemeModeChanged: () => {},
          registerCommandPalette: (opts) => registered.palette.push(opts.label),
          registerPageMenuItem: (label) => registered.pageMenu.push(label),
          getCurrentGraph: async () => ({ name: "测试图谱", path: "C:\\notes\\test" }),
        },
        DB: { datascriptQuery: async () => [] },
        UI: { showMsg: () => {} },
        Assets: { makeSandboxStorage: async () => memStorage() },
        FileStorage: memStorage(),
        ready: (fn) => {
          return Promise.resolve()
            .then(fn)
            .then(async () => {
              let ws = null;
              try {
                ws = await CP.ws.folder();
              } catch (e) {
                ws = { kind: "error:" + e.message };
              }
              const summary = {
                palette: registered.palette.length,
                slash: registered.slash,
                blockMenu: registered.blockMenu.length,
                pageMenu: registered.pageMenu.length,
                schema: registered.schema ? registered.schema.length : 0,
                panel: !!document.querySelector(".cp-root"),
                messages: document.querySelectorAll(".cp-msg").length,
                chips: document.querySelectorAll(".cp-chip").length,
                tools: CP.tools.all().length,
                toolNames: CP.tools.all().map((t) => t.name),
                wsBackend: ws && ws.kind,
                wsGraph: ws && ws.graph,
                wsDir: ws && ws.dir,
                toolButton: (document.querySelector("#cp-tools") || {}).textContent,
                sessionButton: !!document.querySelector('[data-act="sessions"]'),
                themeMode: document.documentElement.getAttribute("data-theme"),
                themeSource: CP.panel.themeInfo ? CP.panel.themeInfo().source : null,
                allowCheckboxInTemplate: !!document.querySelector("#cp-tools"),
                errors: window.__errors,
              };
              document.title = "READY " + JSON.stringify(summary);
            })
            .catch((e) => {
              document.title = "BOOT_FAIL " + e;
            });
        },
      };
    </script>

    <script src="../src/md.js"></script>
    <script src="../src/store.js"></script>
    <script src="../src/llm.js"></script>
    <script src="../src/retrieval.js"></script>
    <script src="../src/context.js"></script>
    <script src="../src/tools.js"></script>
    <script src="../src/workspace.js"></script>
    <script src="../src/agent.js"></script>
    <script src="../src/panel.js"></script>
    <script src="../src/selfcheck.js"></script>
    <script src="../src/main.js"></script>
  </body>
</html>
